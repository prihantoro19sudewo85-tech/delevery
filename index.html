    let gasApiUrl = localStorage.getItem('HNH_GAS_API_URL') || DEFAULT_GAS_API_URL;
    let isSyncingCloud = false;

    function nowStr() {
      const d = new Date();
      return d.toISOString().slice(0, 16).replace('T', ' ');
    }

    function rupiah(num) {
      return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
    }

    function getActiveUser() {
      if (currentRole === 'ADMIN') return db.Users.find(u => u.role === 'ADMIN') || db.Users[0];
      if (currentRole === 'GUDANG') return db.Users.find(u => u.role === 'GUDANG') || db.Users[1];
      if (currentRole === 'KURIR') return db.Users.find(u => u.user_id === selectedCourierUserId) || db.Users[2];
      return db.Users.find(u => u.user_id === selectedCustomerUserId) || db.Users[4];
    }

    function updateCloudBadgeUI() {
      const btn = document.getElementById('cloud-status-btn');
      const txt = document.getElementById('cloud-status-text');
      if (!btn || !txt) return;
      if (gasApiUrl) {
        btn.className = 'px-2.5 py-1.5 rounded-lg font-bold bg-emerald-500 text-slate-950 transition flex items-center gap-1.5 shadow-xs';
        txt.textContent = isSyncingCloud ? 'Menyinkronkan...' : 'Spreadsheet Live (Aktif)';
      } else {
        btn.className = 'px-2.5 py-1.5 rounded-lg font-bold bg-emerald-600/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-600/30 transition flex items-center gap-1.5';
        txt.textContent = 'Hubungkan API Spreadsheet';
      }
    }

    async function saveDB(actionName = 'SYNC_DB', actionPayload = {}) {
      localStorage.setItem('HNH_DELIVERY_DB', JSON.stringify(db));
      updateCloudBadgeUI();
      if (!gasApiUrl) return;

      try {
        isSyncingCloud = true;
        updateCloudBadgeUI();
        const res = await fetch(gasApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'SAVE_ALL_DB',
            lastAction: actionName,
            actor: getActiveUser(),
            payload: actionPayload,
            db: db
          })
        });
        const json = await res.json();
        if (json && json.status === 'ok' && json.db) {
          db = json.db;
          localStorage.setItem('HNH_DELIVERY_DB', JSON.stringify(db));
        }
      } catch (err) {
        console.warn('Gagal sinkron ke Google Spreadsheet:', err);
      } finally {
        isSyncingCloud = false;
        updateCloudBadgeUI();
      }
    }

    async function fetchFromCloudSpreadsheet(silent = false) {
      if (!gasApiUrl) return;
      try {
        isSyncingCloud = true;
        updateCloudBadgeUI();
        const res = await fetch(gasApiUrl + '?action=GET_ALL_DB&t=' + Date.now());
        const json = await res.json();
        if (json && json.status === 'ok' && json.db) {
          db = json.db;
          localStorage.setItem('HNH_DELIVERY_DB', JSON.stringify(db));
          renderApp();
          if (!silent) showToast('Data berhasil disinkronkan dari Google Spreadsheet!', 'success');
        }
      } catch (err) {
        if (!silent) showToast('Gagal mengambil data dari URL Apps Script. Pastikan Who has access = Anyone.', 'error');
      } finally {
        isSyncingCloud = false;
        updateCloudBadgeUI();
      }
    }

      db.Log_Aktivitas.unshift({

        aksi,

        nilai_sebelum: sebelum,
        nilai_sesudah: sesudah,

    function switchAppMode(mode) {
      currentAppMode = mode;
      if (mode === 'STOREFRONT') {

        currentView = 'user-katalog';
      } else {
        if (currentRole === 'USER') currentRole = 'ADMIN';
        currentView = currentRole === 'ADMIN' ? 'admin-dashboard' : (currentRole === 'GUDANG' ? 'gudang-main' : 'kurir-main');

      renderApp();
    }

    function switchRole(role) {
      currentRole = role;
      if (role === 'USER') {
        currentAppMode = 'STOREFRONT';
        currentView = 'user-katalog';
      } else {
        currentAppMode = 'INTERNAL';
        if (role === 'ADMIN') currentView = 'admin-dashboard';
        if (role === 'GUDANG') currentView = 'gudang-main';
        if (role === 'KURIR') currentView = 'kurir-main';

    function orderStatusBadge(status) {
      const map = {
        MENUNGGU_KONFIRMASI: 'bg-amber-100 text-amber-800 border-amber-300',
        DIKONFIRMASI: 'bg-blue-100 text-blue-800 border-blue-300',
        DIPROSES_GUDANG: 'bg-indigo-100 text-indigo-800 border-indigo-300',
        SIAP_DIKIRIM: 'bg-purple-100 text-purple-800 border-purple-300',
        DALAM_PENGIRIMAN: 'bg-cyan-100 text-cyan-800 border-cyan-300',
        SELESAI: 'bg-emerald-100 text-emerald-800 border-emerald-300',
        DIBATALKAN: 'bg-rose-100 text-rose-800 border-rose-300',
        PERLU_TINDAK_LANJUT: 'bg-orange-100 text-orange-800 border-orange-300'
      };
      const cls = map[status] || 'bg-slate-100 text-slate-700 border-slate-300';
      return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold border ${cls}">${status}</span>`;

    function shipmentStatusBadge(status) {

        KURIR_DITUGASKAN: 'bg-blue-100 text-blue-800',
        BARANG_DIAMBIL: 'bg-indigo-100 text-indigo-800',

        TERKIRIM: 'bg-emerald-100 text-emerald-800',
        GAGAL_KIRIM: 'bg-rose-100 text-rose-800',
        DIJADWALKAN_ULANG: 'bg-amber-100 text-amber-800'
      };
      const cls = map[status] || 'bg-slate-100 text-slate-700';
      return `<span class="px-2.5 py-0.5 rounded-full text-[11px] font-extrabold ${cls}">${status}</span>`;

    function addToCustomerCart(produk_id) {
      const qtyInput = document.getElementById('qty-add-' + produk_id);
      const qty = Math.max(1, Number(qtyInput ? qtyInput.value : 1));
      const existing = userCart.find(i => i.produk_id === produk_id);
      if (existing) {
        existing.jumlah += qty;
      } else {
        userCart.push({ produk_id, jumlah: qty, catatan_item: '' });
      }
      showToast('Produk ditambahkan ke keranjang belanja!', 'success');
      renderApp();
    }

      userCart.splice(idx, 1);

    function submitCustomerCheckout() {
      if (userCart.length === 0) return;
      const activeUser = getActiveUser();
      const customer = db.Pelanggan.find(p => p.pelanggan_id === activeUser.pelanggan_id) || db.Pelanggan[0];
      const alamat = document.getElementById('chk-alamat').value.trim();
      const jadwal = document.getElementById('chk-jadwal').value;
      const catatan = document.getElementById('chk-catatan').value.trim();

      const newOrderId = 'ORD-' + String(db.Pesanan.length + 1).padStart(3, '0');
      const nomorPesanan = 'HNH-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(db.Pesanan.length + 1).padStart(3, '0');

      let subtotal = 0;
      userCart.forEach(item => {
        const p = db.Produk.find(x => x.produk_id === item.produk_id);
        if (!p) return;
        const sub = p.harga_jual * item.jumlah;
        subtotal += sub;
        db.Detail_Pesanan.push({
          detail_id: 'DTL-' + String(db.Detail_Pesanan.length + 1).padStart(3, '0'),
          pesanan_id: newOrderId,
          produk_id: p.produk_id,
          sku_snapshot: p.sku,
          nama_produk_snapshot: p.nama_produk,
          satuan_snapshot: p.satuan,
          harga_satuan: p.harga_jual,
          jumlah: item.jumlah,
          subtotal: sub,
          catatan_item: item.catatan_item || '-'
        });
      });

      const ongkir = 25000;
      const newOrder = {
        pesanan_id: newOrderId,
        nomor_pesanan: nomorPesanan,
        tanggal_pesanan: new Date().toISOString().slice(0, 10),
        pelanggan_id: customer.pelanggan_id,
        dibuat_oleh: activeUser.user_id,
        cabang_id: customer.cabang_id,
        alamat_pengiriman: alamat,
        jadwal_kirim: jadwal,
        subtotal: subtotal,
        biaya_pengiriman: ongkir,
        diskon: 0,
        total: subtotal + ongkir,
        status_pesanan: 'MENUNGGU_KONFIRMASI',
        catatan: catatan,
        created_at: nowStr(),
        updated_at: nowStr()
      };

      db.Pesanan.unshift(newOrder);
      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id: newOrderId,
        status: 'MENUNGGU_KONFIRMASI',
        keterangan: 'Pesanan berhasil dibuat oleh pelanggan (' + customer.nama_pelanggan + ')',
        lokasi_label: 'Aplikasi Pelanggan HNH Mart',
        latitude: '-6.2615',
        longitude: '106.8106',
        diubah_oleh: activeUser.user_id,
        created_at: nowStr()
      });

      addAuditLog('BUAT_PESANAN_PELANGGAN', 'Pesanan', newOrderId, '-', 'MENUNGGU_KONFIRMASI');
      userCart = [];
      saveDB('CUSTOMER_CREATE_ORDER', { pesanan_id: newOrderId });
      showToast('Pesanan ' + nomorPesanan + ' berhasil dibuat! Menunggu konfirmasi Admin.', 'success');
      setView('user-tracking');
    }

    function adminConfirmOrder(pesanan_id) {
      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      if (!ord) return;
      const oldStatus = ord.status_pesanan;
      ord.status_pesanan = 'DIKONFIRMASI';
      ord.updated_at = nowStr();

      // Alokasikan stok di cabang
      const items = db.Detail_Pesanan.filter(d => d.pesanan_id === pesanan_id);
      items.forEach(it => {
        const stk = db.Stok.find(s => s.produk_id === it.produk_id && s.cabang_id === ord.cabang_id) || db.Stok.find(s => s.produk_id === it.produk_id);
        if (stk) {
          stk.stok_dialokasikan = Number(stk.stok_dialokasikan) + Number(it.jumlah);
          stk.stok_tersedia = Number(stk.stok_fisik) - Number(stk.stok_dialokasikan);
          stk.updated_at = nowStr();
          db.Mutasi_Stok.unshift({
            mutasi_id: 'MUT-' + String(db.Mutasi_Stok.length + 1).padStart(3, '0'),
            cabang_id: stk.cabang_id,
            produk_id: it.produk_id,
            jenis_mutasi: 'ALOKASI',
            jumlah: it.jumlah,
            referensi_tipe: 'PESANAN',
            referensi_id: pesanan_id,
            alasan: 'Alokasi otomatis saat pesanan dikonfirmasi Admin',
            dibuat_oleh: getActiveUser().user_id,
            created_at: nowStr()
          });
        }
      });

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id: pesanan_id,
        status: 'DIKONFIRMASI',
        keterangan: 'Pesanan disetujui Admin & stok dialokasikan di gudang',
        lokasi_label: 'Pusat Kendali Admin HNH',
        latitude: '-6.2655',
        longitude: '106.8662',
        diubah_oleh: getActiveUser().user_id,
        created_at: nowStr()
      });

      addAuditLog('KONFIRMASI_PESANAN', 'Pesanan', pesanan_id, oldStatus, 'DIKONFIRMASI');
      saveDB('ADMIN_CONFIRM_ORDER', { pesanan_id });
      showToast('Pesanan dikonfirmasi & masuk ke antrean Gudang!', 'success');
      renderApp();
    }

    function adminCancelOrder(pesanan_id) {
      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      if (!ord) return;
      const old = ord.status_pesanan;
      ord.status_pesanan = 'DIBATALKAN';
      ord.updated_at = nowStr();
      addAuditLog('BATALKAN_PESANAN', 'Pesanan', pesanan_id, old, 'DIBATALKAN');
      saveDB('ADMIN_CANCEL_ORDER', { pesanan_id });
      showToast('Pesanan telah dibatalkan.', 'info');
      renderApp();
    }

    function submitAdminCreateOrder() {
      const pelId = document.getElementById('adm-ord-pelanggan').value;
      const prdId = document.getElementById('adm-ord-produk').value;
      const qty = Math.max(1, Number(document.getElementById('adm-ord-qty').value || 1));
      const jadwal = document.getElementById('adm-ord-jadwal').value;

      const pel = db.Pelanggan.find(p => p.pelanggan_id === pelId);
      const prd = db.Produk.find(p => p.produk_id === prdId);
      if (!pel || !prd) return;

      const newOrderId = 'ORD-' + String(db.Pesanan.length + 1).padStart(3, '0');
      const noPesanan = 'HNH-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(db.Pesanan.length + 1).padStart(3, '0');
      const sub = prd.harga_jual * qty;

      db.Pesanan.unshift({
        pesanan_id: newOrderId,
        nomor_pesanan: noPesanan,
        tanggal_pesanan: new Date().toISOString().slice(0, 10),
        pelanggan_id: pel.pelanggan_id,
        dibuat_oleh: getActiveUser().user_id,
        cabang_id: pel.cabang_id,
        alamat_pengiriman: pel.alamat_utama,
        jadwal_kirim: jadwal,
        subtotal: sub,
        biaya_pengiriman: 25000,
        diskon: 0,
        total: sub + 25000,
        status_pesanan: 'MENUNGGU_KONFIRMASI',
        catatan: pel.catatan || '-',
        created_at: nowStr(),
        updated_at: nowStr()
      });

      db.Detail_Pesanan.push({
        detail_id: 'DTL-' + String(db.Detail_Pesanan.length + 1).padStart(3, '0'),
        pesanan_id: newOrderId,
        produk_id: prd.produk_id,
        sku_snapshot: prd.sku,
        nama_produk_snapshot: prd.nama_produk,
        satuan_snapshot: prd.satuan,
        harga_satuan: prd.harga_jual,
        jumlah: qty,
        subtotal: sub,
        catatan_item: 'Dibuat oleh Admin'
      });

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id: newOrderId,
        status: 'MENUNGGU_KONFIRMASI',
        keterangan: 'Pesanan dibuat oleh Admin untuk ' + pel.nama_pelanggan,
        lokasi_label: 'Dashboard Admin HNH',
        latitude: '-6.2655',
        longitude: '106.8662',
        diubah_oleh: getActiveUser().user_id,
        created_at: nowStr()
      });

      closeModal();

            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2 pb-3 border-b border-slate-100">

                    <p class="text-xs text-amber-700 font-semibold">Catatan Khusus: ${ord.catatan || '-'}</p>
                  </div>

                  <div class="flex items-center gap-2">
                    ${ord.status_pesanan === 'DIKONFIRMASI' ? `
                      <button onclick="warehouseStartPicking('${ord.pesanan_id}')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-extrabold">
                        ▶ Mulai Picking Barang
                      </button>
                    ` : ''}
                    ${ord.status_pesanan === 'DIPROSES_GUDANG' ? `
                      <button onclick="warehouseFinishPacking('${ord.pesanan_id}')" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-extrabold">
                        ✓ Packing Selesai & Potong Stok Fisik
                      </button>
                    ` : ''}

                  <p class="font-extrabold text-slate-700">Checklist Barang & Pemeriksaan Kualitas (QC):</p>
                  ${items.map(it => {
                    const checked = warehouseChecklistState[ord.pesanan_id] && warehouseChecklistState[ord.pesanan_id][it.detail_id];
                    return `
                      <label class="p-3 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between cursor-pointer">
                        <div class="flex items-center gap-3">
                          <input type="checkbox" ${checked || ord.status_pesanan === 'SIAP_DIKIRIM' ? 'checked' : ''}
                            onchange="toggleWarehouseCheck('${ord.pesanan_id}', '${it.detail_id}', this.checked)"
                            class="w-4 h-4 rounded text-emerald-600" />
                          <div>
                            <p class="font-bold text-slate-900">${it.nama_produk_snapshot} <span class="font-mono text-slate-400">(${it.sku_snapshot})</span></p>

                          </div>
                        </div>

                          ${it.jumlah} ${it.satuan_snapshot}

                      </label>
                    `;
                  }).join('')}
                </div>

      `;

    function toggleWarehouseCheck(pesanan_id, detail_id, isChecked) {
      if (!warehouseChecklistState[pesanan_id]) warehouseChecklistState[pesanan_id] = {};
      warehouseChecklistState[pesanan_id][detail_id] = isChecked;
    }

    function warehouseStartPicking(pesanan_id) {
      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      if (!ord) return;
      ord.status_pesanan = 'DIPROSES_GUDANG';
      ord.updated_at = nowStr();

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id,
        status: 'DIPROSES_GUDANG',
        keterangan: 'Tim Gudang memulai proses picking & sortir kualitas buah/sayur',
        lokasi_label: 'Area Picking Gudang HNH',
        latitude: '-6.2655',
        longitude: '106.8662',
        diubah_oleh: getActiveUser().user_id,
        created_at: nowStr()
      });

      addAuditLog('MULAI_PICKING', 'Pesanan', pesanan_id, 'DIKONFIRMASI', 'DIPROSES_GUDANG');
      saveDB('WAREHOUSE_START_PICKING', { pesanan_id });
      showToast('Status pesanan diubah menjadi DIPROSES_GUDANG', 'info');
      renderApp();
    }

    function warehouseFinishPacking(pesanan_id) {
      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      if (!ord) return;
      ord.status_pesanan = 'SIAP_DIKIRIM';
      ord.updated_at = nowStr();

      // Potong stok_fisik & kurangi stok_dialokasikan, catat BARANG_KELUAR
      const items = db.Detail_Pesanan.filter(d => d.pesanan_id === pesanan_id);
      items.forEach(it => {
        const stk = db.Stok.find(s => s.produk_id === it.produk_id && s.cabang_id === ord.cabang_id) || db.Stok.find(s => s.produk_id === it.produk_id);
        if (stk) {
          stk.stok_fisik = Math.max(0, Number(stk.stok_fisik) - Number(it.jumlah));
          stk.stok_dialokasikan = Math.max(0, Number(stk.stok_dialokasikan) - Number(it.jumlah));
          stk.stok_tersedia = Number(stk.stok_fisik) - Number(stk.stok_dialokasikan);
          stk.updated_at = nowStr();

          db.Mutasi_Stok.unshift({
            mutasi_id: 'MUT-' + String(db.Mutasi_Stok.length + 1).padStart(3, '0'),
            cabang_id: stk.cabang_id,
            produk_id: it.produk_id,
            jenis_mutasi: 'BARANG_KELUAR',
            jumlah: it.jumlah,
            referensi_tipe: 'PESANAN',
            referensi_id: pesanan_id,
            alasan: 'Packing selesai & siap diserahkan ke pengiriman',
            dibuat_oleh: getActiveUser().user_id,
            created_at: nowStr()
          });
        }
      });

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id,
        status: 'SIAP_DIKIRIM',
        keterangan: 'Packing selesai & pemeriksaan kualitas lulus. Menunggu penugasan kurir.',
        lokasi_label: 'Area Dispatch Gudang HNH',
        latitude: '-6.2655',
        longitude: '106.8662',
        diubah_oleh: getActiveUser().user_id,
        created_at: nowStr()
      });

      addAuditLog('PACKING_SELESAI', 'Pesanan', pesanan_id, 'DIPROSES_GUDANG', 'SIAP_DIKIRIM');
      saveDB('WAREHOUSE_FINISH_PACKING', { pesanan_id });
      showToast('Packing selesai! Stok fisik telah dikurangi & siap ditugaskan ke Kurir.', 'success');
      renderApp();
    }

    function submitAssignCourier(pesanan_id) {
      const resi = document.getElementById('asg-resi').value.trim();
      const kurirId = document.getElementById('asg-kurir').value;
      const jadwal = document.getElementById('asg-jadwal').value;

      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      const kurir = db.Users.find(u => u.user_id === kurirId);
      if (!ord || !kurir) return;

      const newShpId = 'SHP-' + String(db.Pengiriman.length + 1).padStart(3, '0');
      db.Pengiriman.unshift({
        pengiriman_id: newShpId,
        nomor_resi: resi,
        pesanan_id: ord.pesanan_id,
        cabang_id: ord.cabang_id,
        kurir_user_id: kurir.user_id,
        jadwal_pengiriman: jadwal,
        waktu_barang_diambil: '',
        waktu_mulai_kirim: '',
        waktu_terkirim: '',
        status_pengiriman: 'KURIR_DITUGASKAN',
        alasan_gagal: '',
        created_at: nowStr(),
        updated_at: nowStr()
      });

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: newShpId,
        pesanan_id: ord.pesanan_id,
        status: 'KURIR_DITUGASKAN',
        keterangan: `Resi ${resi} diterbitkan. Ditugaskan kepada kurir ${kurir.nama}`,
        lokasi_label: 'Hub Gudang HNH',
        latitude: '-6.2655',
        longitude: '106.8662',
        diubah_oleh: getActiveUser().user_id,
        created_at: nowStr()
      });

      addAuditLog('TUGASKAN_KURIR', 'Pengiriman', newShpId, 'BELUM_DITUGASKAN', 'KURIR_DITUGASKAN');
      closeModal();
      saveDB('ADMIN_ASSIGN_COURIER', { pengiriman_id: newShpId });
      showToast('Kurir berhasil ditugaskan dengan nomor resi ' + resi, 'success');
      renderApp();
    }

        ord.status_pesanan = 'DALAM_PENGIRIMAN';

    function previewCourierPodFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const maxW = 700;
          const scale = Math.min(1, maxW / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.78);
          document.getElementById('pod-foto-base64').value = compressedDataUrl;
          document.getElementById('pod-preview-img').src = compressedDataUrl;
          document.getElementById('pod-preview-box').classList.remove('hidden');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitCourierPOD(pengiriman_id) {
      const penerima = document.getElementById('pod-penerima').value.trim();
      const jenis = document.getElementById('pod-jenis').value;
      const customBase64 = document.getElementById('pod-foto-base64') ? document.getElementById('pod-foto-base64').value : '';
      const foto = customBase64 || document.getElementById('pod-foto').value;
      const catatan = document.getElementById('pod-catatan').value.trim();

      if (!penerima) {
        showToast('Nama penerima wajib diisi sebagai syarat penyelesaian pengiriman!', 'error');
        return;
      }

      const shp = db.Pengiriman.find(s => s.pengiriman_id === pengiriman_id);
      if (!shp) return;
      shp.status_pengiriman = 'TERKIRIM';
      shp.waktu_terkirim = nowStr();
      shp.updated_at = nowStr();

      const ord = db.Pesanan.find(o => o.pesanan_id === shp.pesanan_id);
      if (ord) {
        ord.status_pesanan = 'SELESAI';
        ord.updated_at = nowStr();
      }

      db.Bukti_Pengiriman.unshift({
        bukti_id: 'POD-' + String(db.Bukti_Pengiriman.length + 1).padStart(3, '0'),
        pengiriman_id,
        file_id: 'DRV-' + Math.floor(10000 + Math.random() * 90000),
        file_url: foto,
        nama_penerima: penerima,
        jenis_bukti: jenis,
        catatan,
        diunggah_oleh: getActiveUser().user_id,
        created_at: nowStr()
      });

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id,
        pesanan_id: shp.pesanan_id,
        status: 'TERKIRIM',
        keterangan: `Paket telah diterima oleh ${penerima}. (${catatan})`,
        lokasi_label: ord ? ord.alamat_pengiriman : 'Lokasi Pelanggan',
        latitude: '-6.2615',
        longitude: '106.8106',
        diubah_oleh: getActiveUser().user_id,
        created_at: nowStr()
      });

      addAuditLog('PENGIRIMAN_TERKIRIM', 'Pengiriman', pengiriman_id, 'DALAM_PERJALANAN', 'TERKIRIM');
      closeModal();
      saveDB('COURIER_SUBMIT_POD', { pengiriman_id });
      showToast('Pengiriman selesai! Bukti penerimaan telah tercatat.', 'success');
      renderApp();
    }

    function submitStockMutation() {
      const prdId = document.getElementById('mut-produk').value;
      const jenis = document.getElementById('mut-jenis').value;
      const qty = Math.max(1, Number(document.getElementById('mut-qty').value || 1));
      const alasan = document.getElementById('mut-alasan').value.trim();

      const stk = db.Stok.find(s => s.produk_id === prdId);
      if (stk) {
        if (jenis === 'BARANG_MASUK') stk.stok_fisik = Number(stk.stok_fisik) + qty;
        if (jenis === 'RUSAK') stk.stok_fisik = Math.max(0, Number(stk.stok_fisik) - qty);
        stk.stok_tersedia = Number(stk.stok_fisik) - Number(stk.stok_dialokasikan);
        stk.updated_at = nowStr();
      }

      db.Mutasi_Stok.unshift({
        mutasi_id: 'MUT-' + String(db.Mutasi_Stok.length + 1).padStart(3, '0'),
        cabang_id: 'CAB-01',
        produk_id: prdId,
        jenis_mutasi: jenis,

        referensi_id: '-',
        alasan,
        dibuat_oleh: getActiveUser().user_id,
        created_at: nowStr()
      });

      closeModal();
      saveDB('STOCK_MUTATION', { produk_id: prdId, jenis, qty });
      showToast('Mutasi stok berhasil dicatat!', 'success');
      renderApp();
    }

            </button>
          `).join('')}
        </div>
        <div class="p-4 overflow-x-auto max-h-[60vh] text-[11px]">
          ${rows.length === 0 ? `<p class="text-slate-400 p-4 text-center">Sheet ${activeInspectSheet} masih kosong.</p>` : `
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-800 text-white">
                  ${cols.map(c => `<th class="p-2 border border-slate-700 font-mono">${c}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr class="border-b border-slate-200 hover:bg-slate-50">
                    ${cols.map(c => `<td class="p-2 border border-slate-200">${r[c] !== undefined ? r[c] : ''}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        </div>
      `;
      showModal(html);
    }

    // -----------------------------------------------------------------------
    // MODAL & TOAST HELPERS
    // -----------------------------------------------------------------------
    function showModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const content = document.getElementById('modal-content');
      content.innerHTML = html;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white',
        error: 'bg-rose-600 text-white',
        info: 'bg-slate-900 text-white'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-3 rounded-xl shadow-lg text-xs font-bold ${colors[type] || colors.info}`;
      el.textContent = msg;
      container.appendChild(el);
      setTimeout(() => el.remove(), 3500);
    }

    // -----------------------------------------------------------------------
    // INITIALIZE ON LOAD
    // -----------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get('gas_url')) {
        gasApiUrl = params.get('gas_url');
        localStorage.setItem('HNH_GAS_API_URL', gasApiUrl);
      }
      if (params.get('app') === 'pelanggan') {
        currentAppMode = 'STOREFRONT';
        currentRole = 'USER';
        currentView = 'user-katalog';
      } else if (params.get('app') === 'internal') {
        currentAppMode = 'INTERNAL';
        if (currentRole === 'USER') currentRole = 'ADMIN';
        currentView = 'admin-dashboard';
      }
      if (params.get('production') === '1') {
        const simBar = document.getElementById('simulator-top-bar');
        if (simBar) simBar.classList.add('hidden');
      }
      updateCloudBadgeUI();
      renderApp();
      if (gasApiUrl) {
        fetchFromCloudSpreadsheet(true);
        setInterval(() => {
          if (!isSyncingCloud) fetchFromCloudSpreadsheet(true);
        }, 15000);
      }
    });
  </script>
</body>
</html>
