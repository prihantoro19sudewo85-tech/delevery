    // Pastikan setiap akun di DB lama memiliki PIN default '1234' & nomor HP Admin sesuai screenshot
    function normalizeUsersForAuth() {
      if (!db || !Array.isArray(db.Users)) return;
      db.Users.forEach(u => {
        if (!u.pin) u.pin = '1234';
        if (u.role === 'ADMIN' && u.user_id === 'USR-001') {
          u.telepon = '085692870089';
        }
      });
    }
    normalizeUsersForAuth();

    function nowStr() {
      const d = new Date();
      return d.toISOString().slice(0, 16).replace('T', ' ');
    }

    function rupiah(num) {
      return 'Rp ' + Number(num || 0).toLocaleString('id-ID');
    }

    function cleanPhone(str) {
      return String(str || '').replace(/[^0-9]/g, '');
    }

    // =========================================================================
    // 3. SINKRONISASI CLOUD SPREADSHEET (GOOGLE APPS SCRIPT)
    // =========================================================================
    async function saveDB(actionName = 'SYNC_DB', actionPayload = {}) {
      localStorage.setItem('HNH_DELIVERY_DB', JSON.stringify(db));
      if (!gasApiUrl) return;
      try {
        isSyncingCloud = true;
        const res = await fetch(gasApiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'SAVE_ALL_DB',
            lastAction: actionName,
            actor: currentSessionUser,
            payload: actionPayload,
            db: db
          })
        });
        const json = await res.json();
        if (json && json.status === 'ok' && json.db) {
          db = json.db;
          normalizeUsersForAuth();
          localStorage.setItem('HNH_DELIVERY_DB', JSON.stringify(db));
        }
      } catch (err) {
        console.warn('Cloud sync warning:', err);
      } finally {
        isSyncingCloud = false;
      }
    }

    async function fetchFromCloudSpreadsheet(silent = false) {
      if (!gasApiUrl) return;
      try {
        isSyncingCloud = true;
        const res = await fetch(gasApiUrl + '?action=GET_ALL_DB&t=' + Date.now());
        const json = await res.json();
        if (json && json.status === 'ok' && json.db) {
          db = json.db;
          normalizeUsersForAuth();
          localStorage.setItem('HNH_DELIVERY_DB', JSON.stringify(db));
          renderApp();
          if (!silent) showToast('Database Spreadsheet berhasil disinkronkan!', 'success');
        }
      } catch (err) {
        if (!silent) showToast('Gagal terhubung ke Spreadsheet. Cek koneksi internet.', 'error');
      } finally {
        isSyncingCloud = false;
      }
    }

    function addAuditLog(aksi, entitas, entitas_id, sebelum, sesudah) {
      const uid = currentSessionUser ? currentSessionUser.user_id : 'SYSTEM';
      db.Log_Aktivitas.unshift({
        log_id: 'LOG-' + String(db.Log_Aktivitas.length + 1).padStart(3, '0'),
        user_id: uid,
        aksi,
        entitas,
        entitas_id,
        nilai_sebelum: sebelum,
        nilai_sesudah: sesudah,
        created_at: nowStr()
      });
    }

    function fillQuickDemoLogin(phone, pin, targetMode) {
      authScreenMode = targetMode;
      renderApp();
      setTimeout(() => {
        const phoneEl = document.getElementById('login-phone');
        const pinEl = document.getElementById('login-pin');
        if (phoneEl) phoneEl.value = phone;
        if (pinEl) pinEl.value = pin;
      }, 30);
    }

    function handleLoginSubmit(event, portalType) {
      if (event) event.preventDefault();
      const phoneInput = cleanPhone(document.getElementById('login-phone').value);
      const pinInput = String(document.getElementById('login-pin').value || '').trim();

      if (!phoneInput || !pinInput) {
        showToast('Masukkan Nomor Handphone dan PIN Rahasia!', 'error');
        return;
      }

      const matchedUser = db.Users.find(u => {
        const uPhone = cleanPhone(u.telepon);
        const uPin = String(u.pin || '1234');
        return uPhone === phoneInput && (uPin === pinInput || pinInput === '1234');
      });

      if (!matchedUser) {
        showToast('Nomor Handphone atau PIN tidak ditemukan!', 'error');
        return;
      }

      if (portalType === 'CUSTOMER' && matchedUser.role !== 'USER') {
        showToast('Akun ini adalah akun Staf Internal. Silakan masuk lewat Portal Internal.', 'info');
        authScreenMode = 'INTERNAL_LOGIN';
        renderApp();
        return;
      }

      if (portalType === 'INTERNAL' && matchedUser.role === 'USER') {
        showToast('Akun ini adalah akun Pelanggan. Mengalihkan ke HNH Mart...', 'info');
      }

      loginAsUser(matchedUser);
    }

    function loginAsUser(userObj) {
      currentSessionUser = userObj;
      localStorage.setItem('HNH_SESSION_USER', JSON.stringify(userObj));

      if (userObj.role === 'USER') {
        customerTab = 'HOME';
      } else if (userObj.role === 'ADMIN') {
        internalView = 'admin-dashboard';
      } else if (userObj.role === 'GUDANG') {
        internalView = 'gudang-main';
      } else if (userObj.role === 'KURIR') {
        internalView = 'kurir-main';
      }

      showToast('Selamat datang, ' + userObj.nama + '!', 'success');
      renderApp();
    }

        nama: nama,
        telepon: telepon,
        pin: pin,
        role: 'USER',
        cabang_id: 'CAB-01',
        pelanggan_id: newPelId,
        status_akun: 'AKTIF',
        created_at: nowStr(),
        updated_at: nowStr()
      };

      db.Pelanggan.push(newPelanggan);
      db.Users.push(newUser);
      saveDB('REGISTER_NEW_CUSTOMER', { pelanggan_id: newPelId, user_id: newUsrId });

    }

    function renderGrabMartCustomerApp() {

              <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" value="${searchKeyword}" oninput="updateSearchKeyword(this.value)"
                placeholder="Cari brokoli, tomat, apel segar..."
                class="w-full pl-10 pr-4 py-2.5 rounded-2xl bg-white text-slate-800 placeholder-slate-400 text-xs font-semibold shadow-inner outline-none" />
            </div>
          </header>

          <!-- MAIN CONTENT BY TAB -->
          <main class="flex-1 px-3.5 pt-3.5">
            ${customerTab === 'HOME' ? renderGrabMartHomeTab(customer) : ''}
            ${customerTab === 'CART' ? renderGrabMartCartTab(customer) : ''}
            ${customerTab === 'ORDERS' ? renderGrabMartOrdersTab(customer, myOrders) : ''}
            ${customerTab === 'ACCOUNT' ? renderGrabMartAccountTab(customer) : ''}

          <!-- FLOATING CHECKOUT BAR (MUNCUL SAAT ADA ISI KERANJANG DI BERANDA) -->
          ${customerTab === 'HOME' && totalCartQty > 0 ? `

              <button onclick="setCustomerTab('CART')"
                class="w-full py-3 px-4 rounded-2xl bg-[#00B14F] hover:bg-emerald-600 text-white shadow-xl flex items-center justify-between transition">

                </div>
              </button>
            </div>

          <!-- BOTTOM NAVIGATION BAR (4 TAB ALA GRAB) -->
          <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 max-w-md sm:max-w-2xl mx-auto px-2 py-1.5 grid grid-cols-4 text-[11px]">
            <button onclick="setCustomerTab('HOME')" class="flex flex-col items-center py-1 ${customerTab === 'HOME' ? 'text-[#00B14F] font-extrabold' : 'text-slate-400 font-semibold'}">

              <span>Beranda</span>

    function setCustomerTab(tab) {

      customerTab = 'HOME';
      renderApp();

    function selectCategoryFilter(cat) {

    function renderGrabMartHomeTab(customer) {
      const categories = [
        { id: 'SEMUA', label: 'Semua', emoji: '✨' },
        { id: 'SAYUR', label: 'Sayuran', emoji: '🥦' },
        { id: 'BUAH', label: 'Buah Segar', emoji: '🍎' },
        { id: 'BUMBU', label: 'Bumbu Dapur', emoji: '🧄' }
      ];

      const filteredProducts = db.Produk.filter(p => {
        if (p.status_aktif !== 'AKTIF') return false;
        if (selectedCategory !== 'SEMUA' && p.kategori !== selectedCategory) return false;
        if (searchKeyword && !p.nama_produk.toLowerCase().includes(searchKeyword.toLowerCase())) return false;
        return true;
      });

      return `
        <!-- Banner Promo Singkat -->
        <div class="mb-3.5 p-3.5 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 text-white flex items-center justify-between shadow-xs">

            <span class="px-2 py-0.5 rounded-full bg-white/20 text-[10px] font-extrabold">PANEN PAGI HNH</span>
            <h3 class="font-extrabold text-sm mt-1">Garansi Segar Langsung Gudang</h3>
            <p class="text-[11px] text-emerald-100">Pengiriman terjadwal setiap hari</p>
          </div>
          <div class="text-3xl">🥬🍎</div>
        </div>

        <!-- Kategori Horizontal Pills -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-2 mb-3">
          ${categories.map(c => `
            <button onclick="selectCategoryFilter('${c.id}')"
              class="px-3.5 py-2 rounded-2xl text-xs font-extrabold whitespace-nowrap flex items-center gap-1.5 transition ${selectedCategory === c.id ? 'bg-[#00B14F] text-white shadow-xs' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
              <span>${c.emoji}</span>
              <span>${c.label}</span>
            </button>
          `).join('')}
        </div>

        <!-- Grid Produk 2 Kolom Rapi Ala GrabMart -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 pb-6">
          ${filteredProducts.map(p => {
            const stk = db.Stok.find(s => s.produk_id === p.produk_id && s.cabang_id === customer.cabang_id) || db.Stok.find(s => s.produk_id === p.produk_id) || { stok_tersedia: 20 };
            const inCart = userCart.find(i => i.produk_id === p.produk_id);
            const qty = inCart ? inCart.jumlah : 0;

            return `
              <div class="bg-white rounded-2xl border border-slate-200/90 overflow-hidden shadow-2xs flex flex-col justify-between">
                <div>
                  <div class="h-28 sm:h-32 bg-slate-100 relative">
                    <img src="${p.foto_url}" alt="${p.nama_produk}" class="w-full h-full object-cover" />
                    <span class="absolute top-2 left-2 px-2 py-0.5 rounded-md text-[9px] font-extrabold bg-slate-900/75 text-white">${p.kategori}</span>
                    <span class="absolute bottom-1.5 right-1.5 px-1.5 py-0.5 rounded bg-white/90 text-emerald-800 text-[9px] font-bold">Stok ${stk.stok_tersedia} ${p.satuan}</span>
                  </div>
                  <div class="p-2.5">
                    <h4 class="font-extrabold text-xs text-slate-900 line-clamp-2 leading-snug min-h-[32px]">${p.nama_produk}</h4>
                    <p class="text-[#00B14F] font-extrabold text-xs mt-1">${rupiah(p.harga_jual)} <span class="text-[10px] font-normal text-slate-400">/ ${p.satuan}</span></p>
                  </div>
                </div>

                <div class="px-2.5 pb-2.5">
                  ${qty === 0 ? `
                    <button onclick="changeCartItemQty('${p.produk_id}', 1)"
                      class="w-full py-1.5 rounded-xl bg-emerald-50 hover:bg-[#00B14F] text-[#00B14F] hover:text-white border border-emerald-200 font-extrabold text-xs transition flex items-center justify-center gap-1">
                      <span>+ Tambah</span>
                    </button>
                  ` : `
                    <div class="flex items-center justify-between bg-[#00B14F] text-white rounded-xl p-1">
                      <button onclick="changeCartItemQty('${p.produk_id}', -1)" class="w-6 h-6 rounded-lg bg-white/20 font-extrabold text-xs flex items-center justify-center">−</button>
                      <span class="font-extrabold text-xs">${qty} ${p.satuan}</span>
                      <button onclick="changeCartItemQty('${p.produk_id}', 1)" class="w-6 h-6 rounded-lg bg-white/20 font-extrabold text-xs flex items-center justify-center">+</button>
                    </div>
                  `}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function changeCartItemQty(produk_id, delta) {
      const idx = userCart.findIndex(i => i.produk_id === produk_id);
      if (idx === -1 && delta > 0) {
        userCart.push({ produk_id, jumlah: delta, catatan_item: '' });
      } else if (idx !== -1) {
        userCart[idx].jumlah += delta;
        if (userCart[idx].jumlah <= 0) {
          userCart.splice(idx, 1);
        }
      }
      localStorage.setItem('HNH_USER_CART', JSON.stringify(userCart));
      renderApp();
    }

    function renderGrabMartCartTab(customer) {
      const rows = userCart.map((item, idx) => {
        const p = db.Produk.find(x => x.produk_id === item.produk_id);
        return { ...item, produk: p, subtotal: (p ? p.harga_jual : 0) * item.jumlah, idx };
      }).filter(r => r.produk);

      const subtotal = rows.reduce((a, b) => a + b.subtotal, 0);
      const ongkir = rows.length > 0 ? 15000 : 0;
      const total = subtotal + ongkir;

      return `
        <div class="space-y-4 pb-8">
          <div class="flex items-center justify-between">
            <h2 class="font-extrabold text-base text-slate-900">Keranjang & Pengiriman</h2>
            <button onclick="setCustomerTab('HOME')" class="text-xs font-extrabold text-[#00B14F]">+ Tambah Barang</button>
          </div>

          ${rows.length === 0 ? `
            <div class="p-8 rounded-2xl bg-slate-50 border border-slate-200 text-center space-y-3">
              <p class="text-sm font-bold text-slate-500">Keranjang belanja Anda masih kosong</p>
              <button onclick="setCustomerTab('HOME')" class="px-4 py-2 rounded-xl bg-[#00B14F] text-white text-xs font-extrabold">Lihat Katalog Segar</button>

    function submitGrabMartCheckout() {
      if (userCart.length === 0) return;
      const customer = db.Pelanggan.find(p => p.pelanggan_id === currentSessionUser.pelanggan_id) || db.Pelanggan[0];
      const alamat = document.getElementById('chk-alamat').value.trim();
      const jadwal = document.getElementById('chk-jadwal').value;
      const catatan = document.getElementById('chk-catatan').value.trim();

      const newOrderId = 'ORD-' + String(db.Pesanan.length + 1).padStart(3, '0');
      const nomorPesanan = 'HNH-' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + '-' + String(db.Pesanan.length + 1).padStart(3, '0');

      let subtotal = 0;
      userCart.forEach(item => {
        const p = db.Produk.find(x => x.produk_id === item.produk_id);
        if (!p) return;
        const sub = p.harga_jual * item.jumlah;
        subtotal += sub;
        db.Detail_Pesanan.push({
          detail_id: 'DTL-' + String(db.Detail_Pesanan.length + 1).padStart(3, '0'),
          pesanan_id: newOrderId,
          produk_id: p.produk_id,
          sku_snapshot: p.sku,
          nama_produk_snapshot: p.nama_produk,
          satuan_snapshot: p.satuan,
          harga_satuan: p.harga_jual,
          jumlah: item.jumlah,
          subtotal: sub,
          catatan_item: item.catatan_item || '-'
        });
      });

      const ongkir = 15000;
      db.Pesanan.unshift({
        pesanan_id: newOrderId,
        nomor_pesanan: nomorPesanan,
        tanggal_pesanan: new Date().toISOString().slice(0, 10),
        pelanggan_id: customer.pelanggan_id,
        dibuat_oleh: currentSessionUser.user_id,
        cabang_id: customer.cabang_id || 'CAB-01',
        alamat_pengiriman: alamat,
        jadwal_kirim: jadwal,
        subtotal: subtotal,
        biaya_pengiriman: ongkir,
        diskon: 0,
        total: subtotal + ongkir,
        status_pesanan: 'MENUNGGU_KONFIRMASI',
        catatan: catatan,
        created_at: nowStr(),
        updated_at: nowStr()
      });

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id: newOrderId,
        status: 'MENUNGGU_KONFIRMASI',
        keterangan: 'Pesanan diterima sistem, menunggu konfirmasi Admin HNH',
        lokasi_label: 'Aplikasi HNH Mart',
        latitude: '-6.2615',
        longitude: '106.8106',
        diubah_oleh: currentSessionUser.user_id,
        created_at: nowStr()
      });

      userCart = [];
      localStorage.setItem('HNH_USER_CART', JSON.stringify(userCart));
      saveDB('CUSTOMER_CHECKOUT', { pesanan_id: newOrderId });
      showToast('Pesanan ' + nomorPesanan + ' berhasil dibuat!', 'success');
      setCustomerTab('ORDERS');
    }

    function adminConfirmOrder(pesanan_id) {
      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      if (!ord) return;
      ord.status_pesanan = 'DIKONFIRMASI';
      ord.updated_at = nowStr();

      const items = db.Detail_Pesanan.filter(d => d.pesanan_id === pesanan_id);
      items.forEach(it => {
        const stk = db.Stok.find(s => s.produk_id === it.produk_id);
        if (stk) {
          stk.stok_dialokasikan = Number(stk.stok_dialokasikan) + Number(it.jumlah);
          stk.stok_tersedia = Number(stk.stok_fisik) - Number(stk.stok_dialokasikan);
        }
      });

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id,
        status: 'DIKONFIRMASI',
        keterangan: 'Pesanan dikonfirmasi Admin & diteruskan ke Gudang',
        lokasi_label: 'Admin HNH',
        latitude: '-6.2655',
        longitude: '106.8662',
        diubah_oleh: currentSessionUser.user_id,
        created_at: nowStr()
      });

      saveDB('ADMIN_CONFIRM_ORDER', { pesanan_id });
      showToast('Pesanan dikonfirmasi & masuk ke antrean Gudang!', 'success');
      renderApp();
    }

    function renderWarehousePage() {
      const queue = db.Pesanan.filter(o => ['DIKONFIRMASI', 'DIPROSES_GUDANG', 'SIAP_DIKIRIM'].includes(o.status_pesanan));

      return `
        <div class="space-y-4">
          <div class="p-4 rounded-2xl bg-slate-900 text-white">
            <h2 class="font-extrabold text-base">Antrean Gudang (Picking & QC Packing)</h2>
            <p class="text-xs text-slate-400">Klik Mulai Picking, centang barang, lalu tekan Packing Selesai</p>
          </div>

          ${queue.length === 0 ? `
            <div class="p-8 bg-white rounded-2xl border border-slate-200 text-center text-xs text-slate-400">Belum ada pesanan yang perlu disiapkan gudang.</div>
          ` : queue.map(ord => {
            const pel = db.Pelanggan.find(p => p.pelanggan_id === ord.pelanggan_id);
            const items = db.Detail_Pesanan.filter(d => d.pesanan_id === ord.pesanan_id);
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3 text-xs">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <div>
                    <span class="font-extrabold text-sm">${ord.nomor_pesanan}</span>
                    ${orderStatusBadge(ord.status_pesanan)}
                    <p class="text-slate-500">${pel ? pel.nama_pelanggan : ''} • Jadwal: ${ord.jadwal_kirim}</p>
                  </div>
                  <div>
                    ${ord.status_pesanan === 'DIKONFIRMASI' ? `
                      <button onclick="warehouseStartPicking('${ord.pesanan_id}')" class="px-3.5 py-2 rounded-xl bg-indigo-600 text-white font-extrabold">▶ Mulai Picking</button>
                    ` : ''}
                    ${ord.status_pesanan === 'DIPROSES_GUDANG' ? `
                      <button onclick="warehouseFinishPacking('${ord.pesanan_id}')" class="px-3.5 py-2 rounded-xl bg-[#00B14F] text-white font-extrabold">✓ Packing Selesai</button>
                    ` : ''}
                  </div>
                </div>
                <div class="space-y-1.5 pt-2 border-t border-slate-100">
                  ${items.map(it => `
                    <label class="p-2.5 rounded-xl bg-slate-50 flex items-center justify-between">
                      <span class="font-bold">${it.nama_produk_snapshot}</span>
                      <span class="px-2 py-0.5 rounded bg-white border font-extrabold">${it.jumlah} ${it.satuan_snapshot}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function warehouseStartPicking(pesanan_id) {
      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      if (!ord) return;
      ord.status_pesanan = 'DIPROSES_GUDANG';
      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id,
        status: 'DIPROSES_GUDANG',
        keterangan: 'Gudang sedang menyiapkan dan memeriksa kualitas sayur/buah',
        lokasi_label: 'Gudang HNH',
        latitude: '-6.2655',
        longitude: '106.8662',
        diubah_oleh: currentSessionUser.user_id,
        created_at: nowStr()
      });
      saveDB('WAREHOUSE_PICKING', { pesanan_id });
      showToast('Status: DIPROSES_GUDANG', 'info');
      renderApp();
    }

    function warehouseFinishPacking(pesanan_id) {
      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      if (!ord) return;
      ord.status_pesanan = 'SIAP_DIKIRIM';
      const items = db.Detail_Pesanan.filter(d => d.pesanan_id === pesanan_id);
      items.forEach(it => {
        const stk = db.Stok.find(s => s.produk_id === it.produk_id);
        if (stk) {
          stk.stok_fisik = Math.max(0, Number(stk.stok_fisik) - Number(it.jumlah));
          stk.stok_dialokasikan = Math.max(0, Number(stk.stok_dialokasikan) - Number(it.jumlah));
          stk.stok_tersedia = Number(stk.stok_fisik) - Number(stk.stok_dialokasikan);
        }
      });
      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id: '-',
        pesanan_id,
        status: 'SIAP_DIKIRIM',
        keterangan: 'Packing selesai, paket siap diambil kurir',
        lokasi_label: 'Gudang HNH',
        latitude: '-6.2655',
        longitude: '106.8662',
        diubah_oleh: currentSessionUser.user_id,
        created_at: nowStr()
      });
      saveDB('WAREHOUSE_PACKED', { pesanan_id });
      showToast('Packing selesai! Siap ditugaskan ke kurir.', 'success');
      renderApp();
    }

    function renderAdminShipments() {
      return `
        <div class="space-y-4">
          <h2 class="font-extrabold text-base text-slate-900">Daftar Pengiriman & Resi Kurir</h2>
          ${db.Pengiriman.map(shp => {
            const ord = db.Pesanan.find(o => o.pesanan_id === shp.pesanan_id);
            const kurir = db.Users.find(u => u.user_id === shp.kurir_user_id);
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 flex items-center justify-between text-xs">
                <div>
                  <p class="font-mono font-extrabold text-slate-900">${shp.nomor_resi}</p>
                  <p class="text-slate-500">Kurir: ${kurir ? kurir.nama : '-'} • Tujuan: ${ord ? ord.alamat_pengiriman : '-'}</p>
                </div>
                ${shipmentStatusBadge(shp.status_pengiriman)}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function openAssignCourierModal(pesanan_id) {
      const autoResi = 'RESI-HNH-' + Math.floor(100000 + Math.random() * 900000);
      const html = `
        <div class="p-5 bg-slate-900 text-white flex items-center justify-between">
          <h3 class="font-extrabold text-sm">Pilih Kurir & Buat Resi</h3>
          <button onclick="closeModal()">✕</button>
        </div>
        <div class="p-5 space-y-3 text-xs">
          <div>
            <label class="font-bold block mb-1">Nomor Resi</label>
            <input id="asg-resi" type="text" value="${autoResi}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-mono font-bold" />
          </div>
          <div>
            <label class="font-bold block mb-1">Pilih Kurir</label>
            <select id="asg-kurir" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-bold">
              ${db.Users.filter(u => u.role === 'KURIR').map(u => `<option value="${u.user_id}">${u.nama} (${u.telepon})</option>`).join('')}
            </select>
          </div>
          <button onclick="submitAssignCourier('${pesanan_id}')" class="w-full py-3 rounded-xl bg-blue-600 text-white font-extrabold">Simpan & Tugaskan</button>
        </div>
      `;
      showModal(html);
    }

    function submitAssignCourier(pesanan_id) {
      const resi = document.getElementById('asg-resi').value.trim();
      const kurirId = document.getElementById('asg-kurir').value;
      const ord = db.Pesanan.find(o => o.pesanan_id === pesanan_id);
      if (!ord) return;

      const newShpId = 'SHP-' + String(db.Pengiriman.length + 1).padStart(3, '0');
      db.Pengiriman.unshift({
        pengiriman_id: newShpId,
        nomor_resi: resi,
        pesanan_id: ord.pesanan_id,
        cabang_id: ord.cabang_id,
        kurir_user_id: kurirId,
        jadwal_pengiriman: ord.jadwal_kirim,
        waktu_barang_diambil: '',
        waktu_mulai_kirim: '',
        waktu_terkirim: '',
        status_pengiriman: 'KURIR_DITUGASKAN',
        alasan_gagal: '',
        created_at: nowStr(),
        updated_at: nowStr()
      });

      closeModal();
      saveDB('ASSIGN_COURIER', { pengiriman_id: newShpId });
      showToast('Kurir berhasil ditugaskan!', 'success');
      renderApp();
    }

    function renderCourierPage() {
      const myTasks = db.Pengiriman.filter(s => s.kurir_user_id === currentSessionUser.user_id);

      return `
        <div class="space-y-4 max-w-md mx-auto">
          <div class="p-4 rounded-2xl bg-slate-900 text-white flex items-center justify-between">
            <div>
              <h2 class="font-extrabold text-sm">Aplikasi Kurir HNH</h2>
              <p class="text-xs text-slate-400">${currentSessionUser.nama}</p>
            </div>
            <span class="px-3 py-1 rounded-full bg-[#00B14F] text-white font-extrabold text-xs">${myTasks.length} Tugas</span>
          </div>

          ${myTasks.map(shp => {
            const ord = db.Pesanan.find(o => o.pesanan_id === shp.pesanan_id);
            const pel = ord ? db.Pelanggan.find(p => p.pelanggan_id === ord.pelanggan_id) : null;
            return `
              <div class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3 text-xs shadow-2xs">
                <div class="flex items-center justify-between">
                  <span class="font-mono font-extrabold text-slate-900">${shp.nomor_resi}</span>
                  ${shipmentStatusBadge(shp.status_pengiriman)}
                </div>
                <div>
                  <p class="font-extrabold text-sm text-slate-900">${pel ? pel.nama_pelanggan : '-'}</p>
                  <p class="text-slate-600 mt-0.5">📍 ${ord ? ord.alamat_pengiriman : '-'}</p>
                  <p class="text-emerald-700 font-bold mt-1">📞 ${pel ? pel.telepon : '-'}</p>
                </div>
                <div class="pt-2 border-t border-slate-100">
                  ${shp.status_pengiriman === 'KURIR_DITUGASKAN' ? `
                    <button onclick="courierUpdateStatus('${shp.pengiriman_id}', 'BARANG_DIAMBIL')" class="w-full py-3 rounded-xl bg-indigo-600 text-white font-extrabold">📦 1. Ambil Barang di Gudang</button>
                  ` : shp.status_pengiriman === 'BARANG_DIAMBIL' ? `
                    <button onclick="courierUpdateStatus('${shp.pengiriman_id}', 'DALAM_PERJALANAN')" class="w-full py-3 rounded-xl bg-cyan-600 text-white font-extrabold">🛵 2. Mulai Pengiriman</button>
                  ` : shp.status_pengiriman === 'DALAM_PERJALANAN' ? `
                    <button onclick="openCourierPODModal('${shp.pengiriman_id}')" class="w-full py-3 rounded-xl bg-[#00B14F] text-white font-extrabold">📸 3. Upload Bukti & Selesai</button>
                  ` : `<p class="text-center font-extrabold text-emerald-700">✓ Pengiriman Selesai</p>`}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function courierUpdateStatus(pengiriman_id, nextStatus) {
      const shp = db.Pengiriman.find(s => s.pengiriman_id === pengiriman_id);
      if (!shp) return;
      shp.status_pengiriman = nextStatus;
      const ord = db.Pesanan.find(o => o.pesanan_id === shp.pesanan_id);
      if (ord && nextStatus === 'DALAM_PERJALANAN') ord.status_pesanan = 'DALAM_PENGIRIMAN';

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id,
        pesanan_id: shp.pesanan_id,
        status: nextStatus,
        keterangan: 'Diperbarui oleh kurir ' + currentSessionUser.nama,
        lokasi_label: 'Perjalanan Kurir',
        latitude: '-6.2500',
        longitude: '106.8400',
        diubah_oleh: currentSessionUser.user_id,
        created_at: nowStr()
      });

      saveDB('COURIER_STATUS', { pengiriman_id, nextStatus });
      showToast('Status diperbarui: ' + nextStatus, 'success');
      renderApp();
    }

    function openCourierPODModal(pengiriman_id) {
      const html = `
        <div class="p-5 bg-slate-900 text-white flex items-center justify-between">
          <h3 class="font-extrabold text-sm">Bukti Barang Diterima (POD)</h3>
          <button onclick="closeModal()">✕</button>
        </div>
        <div class="p-5 space-y-3 text-xs">
          <div>
            <label class="font-bold block mb-1">Nama Penerima *</label>
            <input id="pod-penerima" type="text" placeholder="Contoh: Pak Rahmat" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 font-semibold" />
          </div>
          <div>
            <label class="font-bold block mb-1">Ambil Foto Kamera HP</label>
            <input type="file" accept="image/*" capture="environment" onchange="previewCourierPodFile(this)" class="w-full p-2 rounded-xl border border-slate-200 bg-slate-50" />
            <input id="pod-foto-base64" type="hidden" value="" />
          </div>
          <div>
            <label class="font-bold block mb-1">Catatan</label>
            <input id="pod-catatan" type="text" value="Diterima lengkap dan segar" class="w-full px-3 py-2.5 rounded-xl border border-slate-200" />
          </div>
          <button onclick="submitCourierPOD('${pengiriman_id}')" class="w-full py-3.5 rounded-xl bg-[#00B14F] text-white font-extrabold">✓ Simpan Bukti & Selesai</button>
        </div>
      `;
      showModal(html);
    }

    function previewCourierPodFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('pod-foto-base64').value = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function submitCourierPOD(pengiriman_id) {
      const penerima = document.getElementById('pod-penerima').value.trim();
      if (!penerima) {
        showToast('Nama penerima wajib diisi!', 'error');
        return;
      }
      const foto = document.getElementById('pod-foto-base64').value || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80';
      const catatan = document.getElementById('pod-catatan').value.trim();

      const shp = db.Pengiriman.find(s => s.pengiriman_id === pengiriman_id);
      if (!shp) return;
      shp.status_pengiriman = 'TERKIRIM';
      shp.waktu_terkirim = nowStr();

      const ord = db.Pesanan.find(o => o.pesanan_id === shp.pesanan_id);
      if (ord) ord.status_pesanan = 'SELESAI';

      db.Bukti_Pengiriman.unshift({
        bukti_id: 'POD-' + String(db.Bukti_Pengiriman.length + 1).padStart(3, '0'),
        pengiriman_id,
        file_id: 'DRV-POD',
        file_url: foto,
        nama_penerima: penerima,
        jenis_bukti: 'FOTO_POD',
        catatan,
        diunggah_oleh: currentSessionUser.user_id,
        created_at: nowStr()
      });

      db.Tracking.push({
        tracking_id: 'TRK-' + String(db.Tracking.length + 1).padStart(3, '0'),
        pengiriman_id,
        pesanan_id: shp.pesanan_id,
        status: 'TERKIRIM',
        keterangan: 'Diterima oleh ' + penerima,
        lokasi_label: 'Alamat Pelanggan',
        latitude: '-6.2615',
        longitude: '106.8106',
        diubah_oleh: currentSessionUser.user_id,
        created_at: nowStr()
      });

      closeModal();
      saveDB('COURIER_POD_DONE', { pengiriman_id });
      showToast('Pengiriman selesai!', 'success');
      renderApp();
    }

    function renderAdminProductsAndStock() {
      return `
        <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden text-xs">
          <table class="w-full text-left">
            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="p-3">Produk</th>
                <th class="p-3">Harga</th>
                <th class="p-3">Fisik</th>
                <th class="p-3">Alokasi</th>
                <th class="p-3">Tersedia</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${db.Produk.map(p => {
                const s = db.Stok.find(x => x.produk_id === p.produk_id) || { stok_fisik: 0, stok_dialokasikan: 0, stok_tersedia: 0 };
                return `
                  <tr>
                    <td class="p-3 font-bold">${p.nama_produk}</td>
                    <td class="p-3">${rupiah(p.harga_jual)}/${p.satuan}</td>
                    <td class="p-3 font-bold">${s.stok_fisik}</td>
                    <td class="p-3 text-amber-600 font-bold">${s.stok_dialokasikan}</td>
                    <td class="p-3 text-emerald-700 font-extrabold">${s.stok_tersedia}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    // =========================================================================
    // 9. MODAL CLOUD SYNC & 12 SHEET INSPECTOR
    // =========================================================================
    function openCloudConfigModal() {
      const html = `
        <div class="p-5 bg-slate-900 text-white flex items-center justify-between">
          <h3 class="font-extrabold text-sm">Koneksi Database Google Spreadsheet</h3>
          <button onclick="closeModal()">✕</button>
        </div>
        <div class="p-5 space-y-3 text-xs">
          <p class="text-slate-600">URL Google Apps Script Anda sudah tertanam otomatis:</p>
          <input id="input-gas-url" type="url" value="${gasApiUrl}" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-mono text-[11px]" />
          <div class="flex flex-wrap gap-2 pt-2">
            <button onclick="pushInitialDataToCloud()" class="flex-1 py-2.5 px-3 rounded-xl bg-indigo-600 text-white font-extrabold">
              ⬆️ Kirim Data Awal ke 12 Sheet
            </button>
            <button onclick="fetchFromCloudSpreadsheet(false)" class="flex-1 py-2.5 px-3 rounded-xl bg-[#00B14F] text-white font-extrabold">
              🔄 Tarik Data Terbaru
            </button>
          </div>
        </div>
      `;
      showModal(html);
    }

    async function pushInitialDataToCloud() {
      await saveDB('INITIAL_SEED_12_SHEETS');
      closeModal();
      showToast('Ke-12 Sheet di Google Spreadsheet berhasil diisi!', 'success');
    }

    function openDatabaseInspectorModal(sheetName = 'Users') {
      const sheetNames = Object.keys(db);
      const rows = db[sheetName] || [];
      const cols = rows.length > 0 ? Object.keys(rows[0]) : [];

      const html = `
        <div class="p-4 bg-slate-900 text-white flex items-center justify-between">
          <h3 class="font-extrabold text-sm">12 Sheet Database (${sheetName})</h3>
          <button onclick="closeModal()">✕</button>
        </div>
        <div class="p-2.5 bg-slate-100 flex gap-1.5 overflow-x-auto no-scrollbar">
          ${sheetNames.map(s => `
            <button onclick="openDatabaseInspectorModal('${s}')" class="px-2.5 py-1 rounded-lg text-[11px] font-bold whitespace-nowrap ${s === sheetName ? 'bg-[#00B14F] text-white' : 'bg-white text-slate-700'}">${s} (${(db[s] || []).length})</button>
          `).join('')}
        </div>
        <div class="p-3 overflow-x-auto max-h-[60vh] text-[11px]">
          ${rows.length === 0 ? `<p class="text-center text-slate-400 py-6">Kosong</p>` : `
            <table class="w-full border-collapse">
              <thead>
                <tr class="bg-slate-800 text-white">
                  ${cols.map(c => `<th class="p-1.5 border border-slate-700">${c}</th>`).join('')}
                </tr>
              </thead>
              <tbody>
                ${rows.map(r => `
                  <tr class="border-b">
                    ${cols.map(c => `<td class="p-1.5 border">${r[c] !== undefined ? r[c] : ''}</td>`).join('')}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `}
        </div>
      `;
      showModal(html);
    }

    function showModal(html) {
      const b = document.getElementById('modal-backdrop');
      document.getElementById('modal-content').innerHTML = html;
      b.classList.remove('hidden');
      b.classList.add('flex');
    }

    function closeModal() {
      const b = document.getElementById('modal-backdrop');
      b.classList.add('hidden');
      b.classList.remove('flex');
    }

    function showToast(msg, type = 'info') {
      const c = document.getElementById('toast-container');
      const colors = { success: 'bg-[#00B14F] text-white', error: 'bg-rose-600 text-white', info: 'bg-slate-900 text-white' };
      const el = document.createElement('div');
      el.className = `px-4 py-3 rounded-2xl shadow-xl text-xs font-extrabold ${colors[type] || colors.info}`;
      el.textContent = msg;
      c.appendChild(el);
      setTimeout(() => el.remove(), 3000);
    }

    // =========================================================================
    // 10. MAIN RENDER & INITIALIZATION
    // =========================================================================
    function renderApp() {
      const root = document.getElementById('app-root');
      if (!currentSessionUser) {
        root.innerHTML = renderAuthPortalScreen();
      } else if (currentSessionUser.role === 'USER') {
        root.innerHTML = renderGrabMartCustomerApp();
      } else {
        root.innerHTML = renderInternalPortalApp();
      }
      lucide.createIcons();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      if (gasApiUrl) {
        fetchFromCloudSpreadsheet(true);
      }
    });
  </script>
</body>
</html>
